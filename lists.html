<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h2>Software Development Life Cycle (SDLC)</h2>
    <h3>Core SDLC Phases</h3>
    <ol>
        <li>Planning & Analysis</li>
        <li>Design</li>
        <li>Implementation (Coding)</li>
        <li>Testing</li>
        <li>Deployment & Maintenance</li>
    </ol>
    <h3>Guiding Principles and Best Practices</h3>
    <ul>
        <li>Iterative Process</li>
        <li>Early Testing (Shift-Left)</li>
        <li>Automation</li>
        <li>Clear Documentation</li>
    </ul>
</body>
</html>
